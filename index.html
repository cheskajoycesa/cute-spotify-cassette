<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Essie's Cassette Player</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Quicksand:wght@400;500;600;700&display=swap');

        :root {
            --pink: #f29ab5;
            --dark-pink: #d96f92;
            --cream: #fff8ef;
            --paper: #fffdf9;
            --brown: #5b4540;
            --light-pink: #fce3eb;
            --shadow: rgba(91, 69, 64, 0.18);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at 15% 20%, #ffeef4 0 8%, transparent 8.5%),
                radial-gradient(circle at 85% 80%, #ffeef4 0 7%, transparent 7.5%),
                var(--cream);

            font-family: "Quicksand", sans-serif;
            color: var(--brown);

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 25px;
        }

        button,
        input {
            font-family: inherit;
        }

        .player {
            width: 420px;
            max-width: 100%;

            background: var(--paper);

            border: 3px solid var(--brown);
            border-radius: 25px;

            box-shadow:
                8px 8px 0 var(--pink),
                0 12px 30px var(--shadow);

            overflow: hidden;
        }

        /* HEADER */

        .header {
            padding: 20px 22px 10px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 21px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .header p {
            margin: 5px 0 0;
            font-size: 12px;
            opacity: 0.7;
        }

        /* CASSETTE */

        .cassette-area {
            padding: 18px 30px 12px;
        }

        .cassette {
            position: relative;

            width: 100%;
            height: 185px;

            background: linear-gradient(
                145deg,
                #f8b5c8,
                #ef8fac
            );

            border: 3px solid var(--brown);
            border-radius: 13px;

            box-shadow:
                inset 0 0 0 7px rgba(255,255,255,0.18),
                4px 5px 0 rgba(91,69,64,0.15);

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .cassette-label {
            position: absolute;

            width: 72%;
            height: 72px;

            background: #fff4ed;

            border: 2px solid var(--brown);
            border-radius: 7px;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            transform: rotate(-1deg);
        }

        .cassette-label .label-title {
            font-family: "DM Mono", monospace;
            font-size: 12px;
            font-weight: 500;

            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .cassette-label .label-subtitle {
            margin-top: 5px;
            font-size: 10px;
            opacity: 0.65;
        }

        .reel {
            position: absolute;

            width: 54px;
            height: 54px;

            background: #fff7f2;

            border: 3px solid var(--brown);
            border-radius: 50%;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .reel::before {
            content: "";

            width: 22px;
            height: 22px;

            background: var(--pink);

            border: 2px solid var(--brown);
            border-radius: 50%;
        }

        .reel::after {
            content: "";

            position: absolute;

            width: 8px;
            height: 8px;

            background: var(--cream);

            border: 2px solid var(--brown);
            border-radius: 50%;
        }

        .reel.left {
            left: 35px;
        }

        .reel.right {
            right: 35px;
        }

        .playing .reel {
            animation: spin 2s linear infinite;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        /* SONG */

        .song-info {
            text-align: center;
            padding: 10px 25px;
        }

        .song-title {
            font-size: 17px;
            font-weight: 700;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .artist {
            margin-top: 3px;

            font-size: 12px;
            opacity: 0.65;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* CONTROLS */

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 18px;

            padding: 8px 20px;
        }

        .control {
            border: none;
            background: transparent;

            color: var(--brown);

            cursor: pointer;

            font-size: 22px;

            width: 45px;
            height: 45px;

            border-radius: 50%;

            transition:
                transform 0.15s ease,
                background 0.15s ease;
        }

        .control:hover {
            background: var(--light-pink);
            transform: scale(1.08);
        }

        .play {
            width: 58px;
            height: 58px;

            background: var(--pink);

            border: 2px solid var(--brown);

            box-shadow: 3px 3px 0 var(--brown);

            font-size: 22px;
        }

        .play:hover {
            background: #f39bb7;
            transform: translateY(-2px);
        }

        /* SHUFFLE */

        .shuffle-row {
            display: flex;
            justify-content: center;

            padding: 5px 20px 15px;
        }

        .shuffle {
            border: 2px solid var(--brown);

            background: var(--cream);

            border-radius: 999px;

            padding: 8px 15px;

            font-size: 11px;
            font-weight: 700;

            cursor: pointer;

            transition: 0.15s ease;
        }

        .shuffle:hover,
        .shuffle.active {
            background: var(--pink);
        }

        /* PLAYLIST INPUT */

        .playlist-box {
            padding: 15px 20px;

            background: #fff2f6;

            border-top: 2px dashed var(--pink);
        }

        .playlist-box label {
            display: block;

            margin-bottom: 7px;

            font-size: 11px;
            font-weight: 700;
        }

        .playlist-input {
            width: 100%;

            padding: 10px 11px;

            border: 2px solid var(--brown);
            border-radius: 9px;

            background: white;

            font-size: 11px;

            outline: none;
        }

        .playlist-input:focus {
            border-color: var(--dark-pink);
        }

        .load-button,
        .login-button {
            width: 100%;

            margin-top: 8px;

            padding: 10px;

            border: 2px solid var(--brown);
            border-radius: 9px;

            background: var(--pink);

            color: var(--brown);

            font-weight: 700;
            font-size: 12px;

            cursor: pointer;

            box-shadow: 3px 3px 0 var(--brown);

            transition: 0.15s ease;
        }

        .load-button:hover,
        .login-button:hover {
            transform: translateY(-1px);
        }

        .load-button:active,
        .login-button:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0 var(--brown);
        }

        /* PLAYLIST */

        .playlist {
            max-height: 220px;
            overflow-y: auto;

            padding: 10px 15px 15px;
        }

        .playlist-title {
            padding: 5px 5px 8px;

            font-size: 11px;
            font-weight: 700;

            opacity: 0.7;
        }

        .track {
            display: flex;
            align-items: center;

            gap: 10px;

            padding: 8px;

            border-radius: 9px;

            cursor: pointer;

            transition: background 0.15s ease;
        }

        .track:hover {
            background: var(--light-pink);
        }

        .track.active {
            background: #fbd9e4;
        }

        .track-number {
            width: 22px;

            font-family: "DM Mono", monospace;

            font-size: 10px;

            opacity: 0.5;

            text-align: center;
        }

        .track-details {
            min-width: 0;
            flex: 1;
        }

        .track-name {
            font-size: 12px;
            font-weight: 600;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-artist {
            font-size: 10px;

            opacity: 0.6;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* STATUS */

        .status {
            text-align: center;

            padding: 8px 15px 15px;

            font-size: 10px;

            opacity: 0.65;

            min-height: 30px;
        }

        /* LOGIN */

        .login-area {
            padding: 20px;
            text-align: center;
        }

        .login-area p {
            font-size: 12px;
            line-height: 1.5;
        }

        .spotify-note {
            margin-top: 12px;

            font-size: 9px;

            opacity: 0.5;
        }

        /* FOOTER */

        .footer {
            padding: 10px;

            text-align: center;

            font-size: 9px;

            opacity: 0.45;

            border-top: 1px dashed #ead1d8;
        }

        .hidden {
            display: none !important;
        }

        /* MOBILE */

        @media (max-width: 460px) {

            body {
                padding: 15px;
            }

            .player {
                width: 100%;
            }

            .cassette {
                height: 165px;
            }

            .reel.left {
                left: 22px;
            }

            .reel.right {
                right: 22px;
            }
        }
    </style>
</head>

<body>

<div class="player">

    <!-- HEADER -->
    <div class="header">
        <h1>♡ ESSIE'S MIXTAPE ♡</h1>
        <p>my little digital cassette</p>
    </div>


    <!-- LOGIN SCREEN -->
    <div id="loginArea" class="login-area">

        <div style="font-size: 50px; margin: 10px;">
            📼
        </div>

        <p>
            Connect your Spotify account<br>
            to start playing your mixtape.
        </p>

        <button id="loginButton" class="login-button">
            ♫ CONNECT TO SPOTIFY
        </button>

        <div class="spotify-note">
            Spotify Premium is required for web playback.
        </div>

    </div>


    <!-- PLAYER SCREEN -->
    <div id="playerArea" class="hidden">

        <!-- CASSETTE -->
        <div class="cassette-area">

            <div id="cassette" class="cassette">

                <div class="reel left"></div>
                <div class="reel right"></div>

                <div class="cassette-label">

                    <div class="label-title">
                        ESSIE'S MIX
                    </div>

                    <div id="cassetteSubtitle" class="label-subtitle">
                        SIDE A ♡
                    </div>

                </div>

            </div>

        </div>


        <!-- CURRENT SONG -->
        <div class="song-info">

            <div id="songTitle" class="song-title">
                Nothing playing
            </div>

            <div id="artist" class="artist">
                Choose a song below ♡
            </div>

        </div>


        <!-- CONTROLS -->
        <div class="controls">

            <button
                id="previousButton"
                class="control"
                title="Previous">
                ↶
            </button>

            <button
                id="playButton"
                class="control play"
                title="Play / Pause">
                ▶
            </button>

            <button
                id="nextButton"
                class="control"
                title="Next">
                ↷
            </button>

        </div>


        <!-- SHUFFLE -->
        <div class="shuffle-row">

            <button id="shuffleButton" class="shuffle">
                🔀 SHUFFLE
            </button>

        </div>


        <!-- PLAYLIST INPUT -->
        <div class="playlist-box">

            <label for="playlistInput">
                ♡ Spotify Playlist URL
            </label>

            <input
                id="playlistInput"
                class="playlist-input"
                type="text"
                placeholder="https://open.spotify.com/playlist/..."
            >

            <button id="loadButton" class="load-button">
                LOAD TAPE ♫
            </button>

        </div>


        <!-- PLAYLIST -->
        <div class="playlist">

            <div class="playlist-title">
                ♫ TRACKS ON THIS TAPE
            </div>

            <div id="trackList"></div>

        </div>

    </div>


    <!-- STATUS -->
    <div id="status" class="status">
        Ready ♡
    </div>


    <div class="footer">
        Powered by Spotify
    </div>

</div>


<!-- Spotify Web Playback SDK -->
<script src="https://sdk.scdn.co/spotify-player.js"></script>


<script>

    /* =========================================================
       1. SPOTIFY SETTINGS
       ========================================================= */

    /*
       IMPORTANT:
       Replace the value below with YOUR Spotify Client ID.
    */

    const CLIENT_ID = "0298d674562f4f148d8ebc695cb5eaa4";


    /*
       This MUST exactly match the Redirect URI you added
       to your Spotify Developer application.
    */

    const REDIRECT_URI =
        "https://cheskajoycesa.github.io/cute-spotify-cassette/";


    /*
       Permissions our player needs.
    */

    const SCOPES = [
        "streaming",
        "user-read-email",
        "user-read-private",
        "user-read-playback-state",
        "user-modify-playback-state",
        "playlist-read-private",
        "playlist-read-collaborative"
    ].join(" ");


    /* =========================================================
       2. VARIABLES
       ========================================================= */

    let player = null;
    let deviceId = null;

    let tracks = [];
    let currentTrackIndex = -1;

    let playlistId = null;
    let playlistUri = null;

    let shuffleEnabled = false;

    let spotifySDKReady = false;


    /* =========================================================
       3. ELEMENTS
       ========================================================= */

    const loginArea =
        document.getElementById("loginArea");

    const playerArea =
        document.getElementById("playerArea");

    const loginButton =
        document.getElementById("loginButton");

    const loadButton =
        document.getElementById("loadButton");

    const playlistInput =
        document.getElementById("playlistInput");

    const trackList =
        document.getElementById("trackList");

    const songTitle =
        document.getElementById("songTitle");

    const artist =
        document.getElementById("artist");

    const playButton =
        document.getElementById("playButton");

    const previousButton =
        document.getElementById("previousButton");

    const nextButton =
        document.getElementById("nextButton");

    const shuffleButton =
        document.getElementById("shuffleButton");

    const cassette =
        document.getElementById("cassette");

    const status =
        document.getElementById("status");


    /* =========================================================
       4. HELPER FUNCTIONS
       ========================================================= */

    function setStatus(message) {
        status.textContent = message;
    }


    function base64UrlEncode(arrayBuffer) {

        return btoa(
            String.fromCharCode(
                ...new Uint8Array(arrayBuffer)
            )
        )
        .replace(/\+/g, "-")
        .replace(/\//g, "_")
        .replace(/=+$/, "");

    }


    async function sha256(plainText) {

        const encoder =
            new TextEncoder();

        const data =
            encoder.encode(plainText);

        return crypto.subtle.digest(
            "SHA-256",
            data
        );

    }


    function generateRandomString(length) {

        const characters =
            "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";

        const values =
            crypto.getRandomValues(
                new Uint8Array(length)
            );

        return Array.from(values)
            .map(value =>
                characters[value % characters.length]
            )
            .join("");

    }


    /* =========================================================
       5. SPOTIFY LOGIN
       ========================================================= */

    async function login() {

        const codeVerifier =
            generateRandomString(64);

        localStorage.setItem(
            "spotify_code_verifier",
            codeVerifier
        );


        const hashed =
            await sha256(codeVerifier);


        const codeChallenge =
            base64UrlEncode(hashed);


        const state =
            generateRandomString(16);

        localStorage.setItem(
            "spotify_auth_state",
            state
        );


        const authUrl =
            new URL(
                "https://accounts.spotify.com/authorize"
            );


        authUrl.search =
            new URLSearchParams({

                response_type: "code",

                client_id: CLIENT_ID,

                scope: SCOPES,

                redirect_uri: REDIRECT_URI,

                state: state,

                code_challenge_method: "S256",

                code_challenge: codeChallenge

            }).toString();


        window.open(
    authUrl.toString(),
    "_blank"
);

    }


    loginButton.addEventListener(
        "click",
        login
    );


    /* =========================================================
       6. EXCHANGE AUTHORIZATION CODE
       ========================================================= */

    async function exchangeCode(code) {

        const codeVerifier =
            localStorage.getItem(
                "spotify_code_verifier"
            );


        if (!codeVerifier) {

            throw new Error(
                "Missing PKCE code verifier."
            );

        }


        const response =
            await fetch(
                "https://accounts.spotify.com/api/token",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/x-www-form-urlencoded"
                    },

                    body:
                        new URLSearchParams({

                            client_id:
                                CLIENT_ID,

                            grant_type:
                                "authorization_code",

                            code:
                                code,

                            redirect_uri:
                                REDIRECT_URI,

                            code_verifier:
                                codeVerifier

                        })

                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error_description ||
                "Spotify login failed."
            );

        }


        saveTokens(data);


        localStorage.removeItem(
            "spotify_code_verifier"
        );


        window.history.replaceState(
            {},
            document.title,
            REDIRECT_URI
        );

    }


    /* =========================================================
       7. TOKEN STORAGE
       ========================================================= */

    function saveTokens(data) {

        localStorage.setItem(
            "spotify_access_token",
            data.access_token
        );


        localStorage.setItem(
            "spotify_token_expiry",
            String(
                Date.now() +
                (data.expires_in * 1000)
            )
        );


        if (data.refresh_token) {

            localStorage.setItem(
                "spotify_refresh_token",
                data.refresh_token
            );

        }

    }


    async function refreshAccessToken() {

        const refreshToken =
            localStorage.getItem(
                "spotify_refresh_token"
            );


        if (!refreshToken) {

            return false;

        }


        const response =
            await fetch(
                "https://accounts.spotify.com/api/token",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/x-www-form-urlencoded"
                    },

                    body:
                        new URLSearchParams({

                            grant_type:
                                "refresh_token",

                            refresh_token:
                                refreshToken,

                            client_id:
                                CLIENT_ID

                        })

                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            localStorage.removeItem(
                "spotify_access_token"
            );

            localStorage.removeItem(
                "spotify_refresh_token"
            );

            return false;

        }


        saveTokens(data);

        return true;

    }


    async function getAccessToken() {

        const token =
            localStorage.getItem(
                "spotify_access_token"
            );


        const expiry =
            Number(
                localStorage.getItem(
                    "spotify_token_expiry"
                ) || 0
            );


        if (
            token &&
            Date.now() < expiry - 60000
        ) {

            return token;

        }


        const refreshed =
            await refreshAccessToken();


        if (!refreshed) {

            return null;

        }


        return localStorage.getItem(
            "spotify_access_token"
        );

    }


    /* =========================================================
       8. SPOTIFY API REQUEST HELPER
       ========================================================= */

    async function spotifyFetch(
        url,
        options = {}
    ) {

        let token =
            await getAccessToken();


        if (!token) {

            throw new Error(
                "You need to log in to Spotify."
            );

        }


        const headers = {

            ...(options.headers || {}),

            Authorization:
                `Bearer ${token}`

        };


        let response =
            await fetch(
                url,
                {
                    ...options,
                    headers
                }
            );


        /*
           If the token expired, refresh it once
           and try again.
        */

        if (response.status === 401) {

            const refreshed =
                await refreshAccessToken();


            if (!refreshed) {

                throw new Error(
                    "Spotify login expired. Please log in again."
                );

            }


            token =
                await getAccessToken();


            response =
                await fetch(
                    url,
                    {
                        ...options,

                        headers: {

                            ...(options.headers || {}),

                            Authorization:
                                `Bearer ${token}`

                        }

                    }
                );

        }


        return response;

    }


    /* =========================================================
       9. GET PLAYLIST ID FROM URL
       ========================================================= */

    function extractPlaylistId(input) {

        input =
            input.trim();


        /*
           Allows either:
           https://open.spotify.com/playlist/ID
           spotify:playlist:ID
        */

        const urlMatch =
            input.match(
                /open\.spotify\.com\/playlist\/([a-zA-Z0-9]+)/
            );


        if (urlMatch) {

            return urlMatch[1];

        }


        const uriMatch =
            input.match(
                /spotify:playlist:([a-zA-Z0-9]+)/
            );


        if (uriMatch) {

            return uriMatch[1];

        }


        /*
           Also allow just the playlist ID.
        */

        if (
            /^[a-zA-Z0-9]+$/.test(input)
        ) {

            return input;

        }


        return null;

    }


    /* =========================================================
       10. LOAD PLAYLIST
       ========================================================= */

    async function loadPlaylist() {

        const input =
            playlistInput.value;


        const id =
            extractPlaylistId(input);


        if (!id) {

            setStatus(
                "Please paste a valid Spotify playlist URL ♡"
            );

            return;

        }


        playlistId = id;

        playlistUri =
            `spotify:playlist:${id}`;


        setStatus(
            "Loading your mixtape... ♫"
        );


        try {

            tracks = [];

            let url =
                `https://api.spotify.com/v1/playlists/${id}/items?limit=50`;


            while (url) {

                const response =
                    await spotifyFetch(url);


                if (!response.ok) {

                    const error =
                        await response.json()
                        .catch(() => ({}));


                    if (response.status === 403) {

                        throw new Error(
                            "Spotify won't let this app read that playlist. In Spotify's current API, this playlist needs to be owned by you or be collaborative with you."
                        );

                    }


                    throw new Error(
                        error.error?.message ||
                        "Unable to load playlist."
                    );

                }


                const data =
                    await response.json();


                for (
                    const item of data.items || []
                ) {

                    const track =
                        item.item;


                    if (
                        track &&
                        track.type === "track" &&
                        track.uri &&
                        track.is_playable !== false
                    ) {

                        tracks.push(track);

                    }

                }


                url =
                    data.next;

            }


            if (tracks.length === 0) {

                throw new Error(
                    "No playable songs were found in this playlist."
                );

            }


            displayTracks();

            setStatus(
                `${tracks.length} songs loaded ♡`
            );


        } catch (error) {

            console.error(error);

            setStatus(
                error.message
            );

        }

    }


    loadButton.addEventListener(
        "click",
        loadPlaylist
    );


    /* =========================================================
       11. DISPLAY TRACK LIST
       ========================================================= */

    function displayTracks() {

        trackList.innerHTML = "";


        tracks.forEach(
            (track, index) => {

                const row =
                    document.createElement(
                        "div"
                    );


                row.className =
                    "track";


                row.dataset.index =
                    index;


                const number =
                    document.createElement(
                        "div"
                    );


                number.className =
                    "track-number";


                number.textContent =
                    String(index + 1);


                const details =
                    document.createElement(
                        "div"
                    );


                details.className =
                    "track-details";


                const name =
                    document.createElement(
                        "div"
                    );


                name.className =
                    "track-name";


                name.textContent =
                    track.name;


                const artistName =
                    document.createElement(
                        "div"
                    );


                artistName.className =
                    "track-artist";


                artistName.textContent =
                    track.artists
                        .map(
                            artist =>
                                artist.name
                        )
                        .join(", ");


                details.appendChild(
                    name
                );


                details.appendChild(
                    artistName
                );


                row.appendChild(
                    number
                );


                row.appendChild(
                    details
                );


                row.addEventListener(
                    "click",
                    () => {

                        playTrack(index);

                    }
                );


                trackList.appendChild(
                    row
                );

            }
        );

    }


    /* =========================================================
       12. SPOTIFY WEB PLAYBACK SDK
       ========================================================= */

    window.onSpotifyWebPlaybackSDKReady =
        function () {

            spotifySDKReady = true;

            initializePlayer();

        };


    async function initializePlayer() {

        if (!spotifySDKReady) {
            return;
        }


        if (player) {
            return;
        }


        const token =
            await getAccessToken();


        if (!token) {
            return;
        }


        player =
            new Spotify.Player({

                name:
                    "Essie's Cute Cassette",

                volume:
                    0.7,

                getOAuthToken:
                    async callback => {

                        const freshToken =
                            await getAccessToken();

                        callback(
                            freshToken
                        );

                    }

            });


        /* READY */

        player.addListener(
            "ready",
            async ({ device_id }) => {

                deviceId =
                    device_id;


                setStatus(
                    "Cassette player ready ♡"
                );


                /*
                   Transfer Spotify playback
                   to our browser player.
                */

                try {

                    await spotifyFetch(
                        "https://api.spotify.com/v1/me/player",
                        {

                            method: "PUT",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({

                                    device_ids:
                                        [deviceId],

                                    play:
                                        false

                                })

                        }
                    );

                } catch (error) {

                    console.error(
                        error
                    );

                }

            }
        );


        /* CURRENT SONG */

        player.addListener(
            "player_state_changed",
            state => {

                if (!state) {
                    return;
                }


                const current =
                    state.track_window
                        .current_track;


                if (!current) {
                    return;
                }


                songTitle.textContent =
                    current.name;


                artist.textContent =
                    current.artists
                        .map(
                            a => a.name
                        )
                        .join(", ");


                playButton.textContent =
                    state.paused
                        ? "▶"
                        : "❚❚";


                cassette.classList.toggle(
                    "playing",
                    !state.paused
                );


                /*
                   Find the corresponding
                   song in our playlist.
                */

                const index =
                    tracks.findIndex(
                        track =>
                            track.uri ===
                            current.uri
                    );


                if (index !== -1) {

                    currentTrackIndex =
                        index;

                    highlightTrack(
                        index
                    );

                }

            }
        );


        /* ERRORS */

        player.addListener(
            "initialization_error",
            ({ message }) => {

                console.error(
                    "Initialization error:",
                    message
                );

                setStatus(
                    "Spotify player could not initialize."
                );

            }
        );


        player.addListener(
            "authentication_error",
            ({ message }) => {

                console.error(
                    "Authentication error:",
                    message
                );

                setStatus(
                    "Spotify authentication failed."
                );

            }
        );


        player.addListener(
            "account_error",
            ({ message }) => {

                console.error(
                    "Account error:",
                    message
                );

                setStatus(
                    "Spotify Premium is required for web playback."
                );

            }
        );


        player.addListener(
            "playback_error",
            ({ message }) => {

                console.error(
                    "Playback error:",
                    message
                );

                setStatus(
                    message
                );

            }
        );


        await player.connect();

    }


    /* =========================================================
       13. PLAY SELECTED SONG
       ========================================================= */

    async function playTrack(index) {

        if (!deviceId) {

            setStatus(
                "The cassette player is still connecting..."
            );

            return;

        }


        if (
            !playlistUri ||
            tracks.length === 0
        ) {

            return;

        }


        currentTrackIndex =
            index;


        setStatus(
            "Playing ♫"
        );


        try {

            /*
               We start the actual Spotify playlist
               at the selected position.

               This gives Previous / Next a real
               playlist context.
            */

            const response =
                await spotifyFetch(
                    `https://api.spotify.com/v1/me/player/play?device_id=${encodeURIComponent(deviceId)}`,
                    {

                        method: "PUT",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify({

                                context_uri:
                                    playlistUri,

                                offset: {

                                    position:
                                        index

                                },

                                position_ms:
                                    0

                            })

                    }
                );


            if (!response.ok) {

                const error =
                    await response.json()
                    .catch(() => ({}));


                throw new Error(
                    error.error?.message ||
                    "Unable to play this song."
                );

            }


            highlightTrack(
                index
            );


        } catch (error) {

            console.error(error);

            setStatus(
                error.message
            );

        }

    }


    /* =========================================================
       14. PLAY / PAUSE
       ========================================================= */

    playButton.addEventListener(
        "click",
        async () => {

            if (!player) {

                setStatus(
                    "Spotify player isn't ready yet."
                );

                return;

            }


            try {

                await player.activateElement();

                await player.togglePlay();

            } catch (error) {

                console.error(
                    error
                );

            }

        }
    );


    /* =========================================================
       15. NEXT
       ========================================================= */

    nextButton.addEventListener(
        "click",
        async () => {

            if (!player) {
                return;
            }


            try {

                await player.nextTrack();

            } catch (error) {

                console.error(
                    error
                );

            }

        }
    );


    /* =========================================================
       16. PREVIOUS
       ========================================================= */

    previousButton.addEventListener(
        "click",
        async () => {

            if (!player) {
                return;
            }


            try {

                await player.previousTrack();

            } catch (error) {

                console.error(
                    error
                );

            }

        }
    );


    /* =========================================================
       17. SHUFFLE
       ========================================================= */

    shuffleButton.addEventListener(
        "click",
        async () => {

            if (!deviceId) {
                return;
            }


            shuffleEnabled =
                !shuffleEnabled;


            try {

                const response =
                    await spotifyFetch(
                        `https://api.spotify.com/v1/me/player/shuffle?state=${shuffleEnabled}&device_id=${encodeURIComponent(deviceId)}`,
                        {

                            method: "PUT"

                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        "Unable to change shuffle mode."
                    );

                }


                shuffleButton.classList.toggle(
                    "active",
                    shuffleEnabled
                );


                shuffleButton.textContent =
                    shuffleEnabled
                        ? "🔀 SHUFFLE ON"
                        : "🔀 SHUFFLE";

            } catch (error) {

                console.error(
                    error
                );

                shuffleEnabled =
                    !shuffleEnabled;

            }

        }
    );


    /* =========================================================
       18. HIGHLIGHT CURRENT SONG
       ========================================================= */

    function highlightTrack(index) {

        document
            .querySelectorAll(".track")
            .forEach(
                element => {

                    element.classList.toggle(
                        "active",
                        Number(
                            element.dataset.index
                        ) === index
                    );

                }
            );

    }


    /* =========================================================
       19. INITIAL PAGE STARTUP
       ========================================================= */

    async function startup() {

        if (
            CLIENT_ID ===
            "PASTE_YOUR_CLIENT_ID_HERE"
        ) {

            setStatus(
                "Add your Spotify Client ID to the code first ♡"
            );

            return;

        }


        const params =
            new URLSearchParams(
                window.location.search
            );


        const code =
            params.get("code");


        const returnedState =
            params.get("state");


        const error =
            params.get("error");


        if (error) {

            setStatus(
                `Spotify login cancelled: ${error}`
            );

            return;

        }


        if (code) {

            const savedState =
                localStorage.getItem(
                    "spotify_auth_state"
                );


            if (
                !savedState ||
                savedState !== returnedState
            ) {

                setStatus(
                    "Spotify login security check failed."
                );

                return;

            }


            try {

                setStatus(
                    "Connecting to Spotify..."
                );


                await exchangeCode(
                    code
                );


            } catch (error) {

                console.error(
                    error
                );

                setStatus(
                    error.message
                );

                return;

            }

        }


        const token =
            await getAccessToken();


        if (token) {

            loginArea.classList.add(
                "hidden"
            );

            playerArea.classList.remove(
                "hidden"
            );


            initializePlayer();

        }

    }


    startup();

</script>
