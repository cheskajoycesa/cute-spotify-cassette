<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Essie's Cassette Player</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Quicksand:wght@400;500;600;700&display=swap');

        :root {
            --pink: #f29ab5;
            --dark-pink: #d96f92;
            --cream: #fff8ef;
            --paper: #fffdf9;
            --brown: #5b4540;
            --light-pink: #fce3eb;
            --shadow: rgba(91, 69, 64, 0.18);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at 15% 20%, #ffeef4 0 8%, transparent 8.5%),
                radial-gradient(circle at 85% 80%, #ffeef4 0 7%, transparent 7.5%),
                var(--cream);

            font-family: "Quicksand", sans-serif;
            color: var(--brown);

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 25px;
        }

        button,
        input {
            font-family: inherit;
        }

        .player {
            width: 420px;
            max-width: 100%;

            background: var(--paper);

            border: 3px solid var(--brown);
            border-radius: 25px;

            box-shadow:
                8px 8px 0 var(--pink),
                0 12px 30px var(--shadow);

            overflow: hidden;
        }

        /* HEADER */

        .header {
            padding: 20px 22px 10px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 21px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .header p {
            margin: 5px 0 0;
            font-size: 12px;
            opacity: 0.7;
        }

        /* CASSETTE */

        .cassette-area {
            padding: 18px 30px 12px;
        }

        .cassette {
            position: relative;

            width: 100%;
            height: 185px;

            background: linear-gradient(
                145deg,
                #f8b5c8,
                #ef8fac
            );

            border: 3px solid var(--brown);
            border-radius: 13px;

            box-shadow:
                inset 0 0 0 7px rgba(255,255,255,0.18),
                4px 5px 0 rgba(91,69,64,0.15);

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .cassette-label {
            position: absolute;

            width: 72%;
            height: 72px;

            background: #fff4ed;

            border: 2px solid var(--brown);
            border-radius: 7px;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            transform: rotate(-1deg);
        }

        .cassette-label .label-title {
            font-family: "DM Mono", monospace;
            font-size: 12px;
            font-weight: 500;

            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .cassette-label .label-subtitle {
            margin-top: 5px;
            font-size: 10px;
            opacity: 0.65;
        }

        .reel {
            position: absolute;

            width: 54px;
            height: 54px;

            background: #fff7f2;

            border: 3px solid var(--brown);
            border-radius: 50%;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .reel::before {
            content: "";

            width: 22px;
            height: 22px;

            background: var(--pink);

            border: 2px solid var(--brown);
            border-radius: 50%;
        }

        .reel::after {
            content: "";

            position: absolute;

            width: 8px;
            height: 8px;

            background: var(--cream);

            border: 2px solid var(--brown);
            border-radius: 50%;
        }

        .reel.left {
            left: 35px;
        }

        .reel.right {
            right: 35px;
        }

        .playing .reel {
            animation: spin 2s linear infinite;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        /* SONG */

        .song-info {
            text-align: center;
            padding: 10px 25px;
        }

        .song-title {
            font-size: 17px;
            font-weight: 700;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .artist {
            margin-top: 3px;

            font-size: 12px;
            opacity: 0.65;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* CONTROLS */

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 18px;

            padding: 8px 20px;
        }

        .control {
            border: none;
            background: transparent;

            color: var(--brown);

            cursor: pointer;

            font-size: 22px;

            width: 45px;
            height: 45px;

            border-radius: 50%;

            transition:
                transform 0.15s ease,
                background 0.15s ease;
        }

        .control:hover {
            background: var(--light-pink);
            transform: scale(1.08);
        }

        .play {
            width: 58px;
            height: 58px;

            background: var(--pink);

            border: 2px solid var(--brown);

            box-shadow: 3px 3px 0 var(--brown);

            font-size: 22px;
        }

        .play:hover {
            background: #f39bb7;
            transform: translateY(-2px);
        }

        /* SHUFFLE */

        .shuffle-row {
            display: flex;
            justify-content: center;

            padding: 5px 20px 15px;
        }

        .shuffle {
            border: 2px solid var(--brown);

            background: var(--cream);

            border-radius: 999px;

            padding: 8px 15px;

            font-size: 11px;
            font-weight: 700;

            cursor: pointer;

            transition: 0.15s ease;
        }

        .shuffle:hover,
        .shuffle.active {
            background: var(--pink);
        }

        /* PLAYLIST INPUT */

        .playlist-box {
            padding: 15px 20px;

            background: #fff2f6;

            border-top: 2px dashed var(--pink);
        }

        .playlist-box label {
            display: block;

            margin-bottom: 7px;

            font-size: 11px;
            font-weight: 700;
        }

        .playlist-input {
            width: 100%;

            padding: 10px 11px;

            border: 2px solid var(--brown);
            border-radius: 9px;

            background: white;

            font-size: 11px;

            outline: none;
        }

        .playlist-input:focus {
            border-color: var(--dark-pink);
        }

        .load-button,
        .login-button {
            width: 100%;

            margin-top: 8px;

            padding: 10px;

            border: 2px solid var(--brown);
            border-radius: 9px;

            background: var(--pink);

            color: var(--brown);

            font-weight: 700;
            font-size: 12px;

            cursor: pointer;

            box-shadow: 3px 3px 0 var(--brown);

            transition: 0.15s ease;
        }

        .load-button:hover,
        .login-button:hover {
            transform: translateY(-1px);
        }

        .load-button:active,
        .login-button:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0 var(--brown);
        }

        /* PLAYLIST */

        .playlist {
            max-height: 220px;
            overflow-y: auto;

            padding: 10px 15px 15px;
        }

        .playlist-title {
            padding: 5px 5px 8px;

            font-size: 11px;
            font-weight: 700;

            opacity: 0.7;
        }

        .track {
            display: flex;
            align-items: center;

            gap: 10px;

            padding: 8px;

            border-radius: 9px;

            cursor: pointer;

            transition: background 0.15s ease;
        }

        .track:hover {
            background: var(--light-pink);
        }

        .track.active {
            background: #fbd9e4;
        }

        .track-number {
            width: 22px;

            font-family: "DM Mono", monospace;

            font-size: 10px;

            opacity: 0.5;

            text-align: center;
        }

        .track-details {
            min-width: 0;
            flex: 1;
        }

        .track-name {
            font-size: 12px;
            font-weight: 600;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-artist {
            font-size: 10px;

            opacity: 0.6;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* STATUS */

        .status {
            text-align: center;

            padding: 8px 15px 15px;

            font-size: 10px;

            opacity: 0.65;

            min-height: 30px;
        }

        /* LOGIN */

        .login-area {
            padding: 20px;
            text-align: center;
        }

        .login-area p {
            font-size: 12px;
            line-height: 1.5;
        }

        .spotify-note {
            margin-top: 12px;

            font-size: 9px;

            opacity: 0.5;
        }

        /* FOOTER */

        .footer {
            padding: 10px;

            text-align: center;

            font-size: 9px;

            opacity: 0.45;

            border-top: 1px dashed #ead1d8;
        }

        .hidden {
            display: none !important;
        }

        /* MOBILE */

        @media (max-width: 460px) {

            body {
                padding: 15px;
            }

            .player {
                width: 100%;
            }

            .cassette {
                height: 165px;
            }

            .reel.left {
                left: 22px;
            }

            .reel.right {
                right: 22px;
            }
        }
    </style>
</head>

<!-- Spotify Web Playback SDK -->
<script src="https://sdk.scdn.co/spotify-player.js"></script>


<script>

    /* =========================================================
       1. SPOTIFY SETTINGS
       ========================================================= */

    /*
       IMPORTANT:
       Replace the value below with YOUR Spotify Client ID.
    */

    const CLIENT_ID = "0298d674562f4f148d8ebc695cb5eaa4";


    /*
       This MUST exactly match the Redirect URI you added
       to your Spotify Developer application.
    */

    const REDIRECT_URI =
        "https://cheskajoycesa.github.io/cute-spotify-cassette/";


    /*
       Permissions our player needs.
    */

    const SCOPES = [
        "streaming",
        "user-read-email",
        "user-read-private",
        "user-read-playback-state",
        "user-modify-playback-state",
        "playlist-read-private",
        "playlist-read-collaborative"
    ].join(" ");


    /* =========================================================
       2. VARIABLES
       ========================================================= */

    let player = null;
    let deviceId = null;

    let tracks = [];
    let currentTrackIndex = -1;

    let playlistId = null;
    let playlistUri = null;

    let shuffleEnabled = false;

    let spotifySDKReady = false;


    /* =========================================================
       3. ELEMENTS
       ========================================================= */

    const loginArea =
        document.getElementById("loginArea");

    const playerArea =
        document.getElementById("playerArea");

    const loginButton =
        document.getElementById("loginButton");

    const loadButton =
        document.getElementById("loadButton");

    const playlistInput =
        document.getElementById("playlistInput");

    const trackList =
        document.getElementById("trackList");

    const songTitle =
        document.getElementById("songTitle");

    const artist =
        document.getElementById("artist");

    const playButton =
        document.getElementById("playButton");

    const previousButton =
        document.getElementById("previousButton");

    const nextButton =
        document.getElementById("nextButton");

    const shuffleButton =
        document.getElementById("shuffleButton");

    const cassette =
        document.getElementById("cassette");

    const status =
        document.getElementById("status");


    /* =========================================================
       4. HELPER FUNCTIONS
       ========================================================= */

    function setStatus(message) {
        status.textContent = message;
    }


    function base64UrlEncode(arrayBuffer) {

        return btoa(
            String.fromCharCode(
                ...new Uint8Array(arrayBuffer)
            )
        )
        .replace(/\+/g, "-")
        .replace(/\//g, "_")
        .replace(/=+$/, "");

    }


    async function sha256(plainText) {

        const encoder =
            new TextEncoder();

        const data =
            encoder.encode(plainText);

        return crypto.subtle.digest(
            "SHA-256",
            data
        );

    }


    function generateRandomString(length) {

        const characters =
            "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";

        const values =
            crypto.getRandomValues(
                new Uint8Array(length)
            );

        return Array.from(values)
            .map(value =>
                characters[value % characters.length]
            )
            .join("");

    }


   /* =========================================================
   5. SPOTIFY AUTHENTICATION
   ========================================================= */

/*
   This version is designed to work when the cassette
   player is embedded inside Notion.

   Flow:

   Notion iframe
       ↓
   opens popup
       ↓
   popup starts Spotify PKCE login
       ↓
   Spotify redirects back to popup
       ↓
   popup exchanges code for token
       ↓
   popup sends token to Notion iframe
*/


/*
   Detect whether this page is currently the
   Spotify authentication popup.
*/

const urlParams =
    new URLSearchParams(
        window.location.search
    );

const IS_AUTH_POPUP =
    urlParams.get("spotify_popup") === "1";


/*
   Our own GitHub Pages origin.

   This is NOT the full URL.
   It is only:

   https://cheskajoycesa.github.io
*/

const APP_ORIGIN =
    window.location.origin;


/*
   The popup remembers where its opener came from.

   When opened from Notion, document.referrer should
   contain the Notion page that opened it.

   We save only the ORIGIN, not the full URL.
*/

if (
    IS_AUTH_POPUP &&
    document.referrer
) {

    try {

        const referrerOrigin =
            new URL(
                document.referrer
            ).origin;


        sessionStorage.setItem(
            "spotify_opener_origin",
            referrerOrigin
        );

    } catch (error) {

        console.warn(
            "Could not determine opener origin."
        );

    }

}


/* =========================================================
   5A. START SPOTIFY LOGIN
   ========================================================= */

async function login() {

    /*
       Instead of sending the Notion iframe directly
       to Spotify, open our own page as a popup.

       That popup will generate the PKCE verifier.
    */

    const popupUrl =
        `${REDIRECT_URI}?spotify_popup=1`;


    const popup =
        window.open(
            popupUrl,
            "spotify_login",
            "width=500,height=700,resizable=yes,scrollbars=yes"
        );


    if (!popup) {

        setStatus(
            "Please allow popups for this page ♡"
        );

        return;

    }


    setStatus(
        "Spotify login opened ♫"
    );

}


/*
   Connect the existing button to our new login.
*/

loginButton.addEventListener(
    "click",
    login
);


/* =========================================================
   5B. GENERATE PKCE VERIFIER
   ========================================================= */

function generateRandomString(length) {

    const characters =
        "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";


    const values =
        crypto.getRandomValues(
            new Uint8Array(length)
        );


    return Array.from(values)
        .map(
            value =>
                characters[
                    value % characters.length
                ]
        )
        .join("");

}


/* =========================================================
   5C. SHA-256
   ========================================================= */

async function sha256(plainText) {

    const encoder =
        new TextEncoder();


    const data =
        encoder.encode(
            plainText
        );


    return crypto.subtle.digest(
        "SHA-256",
        data
    );

}


/* =========================================================
   5D. BASE64 URL ENCODING
   ========================================================= */

function base64UrlEncode(arrayBuffer) {

    return btoa(
        String.fromCharCode(
            ...new Uint8Array(
                arrayBuffer
            )
        )
    )
    .replace(/\+/g, "-")
    .replace(/\//g, "_")
    .replace(/=+$/, "");

}


/* =========================================================
   5E. START AUTHORIZATION INSIDE POPUP
   ========================================================= */

async function startPopupAuthorization() {

    /*
       Generate the PKCE verifier INSIDE THE POPUP.

       This means the verifier survives the Spotify
       redirect because it belongs to the popup's
       own browsing context.
    */

    const codeVerifier =
        generateRandomString(64);


    const state =
        generateRandomString(32);


    /*
       Save both values in sessionStorage.

       sessionStorage survives navigation from:

       GitHub → Spotify → GitHub

       within the same popup tab/window.
    */

    sessionStorage.setItem(
        "spotify_code_verifier",
        codeVerifier
    );


    sessionStorage.setItem(
        "spotify_auth_state",
        state
    );


    /*
       Create the PKCE challenge.
    */

    const hashed =
        await sha256(
            codeVerifier
        );


    const codeChallenge =
        base64UrlEncode(
            hashed
        );


    /*
       Build Spotify authorization URL.
    */

    const authUrl =
        new URL(
            "https://accounts.spotify.com/authorize"
        );


    authUrl.search =
        new URLSearchParams({

            response_type:
                "code",

            client_id:
                CLIENT_ID,

            scope:
                SCOPES,

            redirect_uri:
                REDIRECT_URI,

            state:
                state,

            code_challenge_method:
                "S256",

            code_challenge:
                codeChallenge

        }).toString();


    /*
       Navigate THIS popup to Spotify.
    */

    window.location.href =
        authUrl.toString();

}


/* =========================================================
   6. EXCHANGE AUTHORIZATION CODE
   ========================================================= */

async function exchangeCode(code) {

    /*
       Retrieve the PKCE verifier that was generated
       by this popup before it went to Spotify.
    */

    const codeVerifier =
        sessionStorage.getItem(
            "spotify_code_verifier"
        );


    if (!codeVerifier) {

        throw new Error(
            "PKCE verifier was not found. Please try Spotify login again."
        );

    }


    /*
       Exchange the authorization code for tokens.
    */

    const response =
        await fetch(
            "https://accounts.spotify.com/api/token",
            {

                method:
                    "POST",

                headers: {

                    "Content-Type":
                        "application/x-www-form-urlencoded"

                },

                body:
                    new URLSearchParams({

                        client_id:
                            CLIENT_ID,

                        grant_type:
                            "authorization_code",

                        code:
                            code,

                        redirect_uri:
                            REDIRECT_URI,

                        code_verifier:
                            codeVerifier

                    })

            }
        );


    const data =
        await response.json();


    if (!response.ok) {

        throw new Error(
            data.error_description ||
            data.error ||
            "Spotify login failed."
        );

    }


    /*
       Save the tokens locally in this popup first.
    */

    saveTokens(data);


    /*
       Send the successful login back to the
       Notion cassette player.
    */

    sendAuthenticationToOpener(
        data
    );


    /*
       Remove the temporary PKCE values.
    */

    sessionStorage.removeItem(
        "spotify_code_verifier"
    );


    sessionStorage.removeItem(
        "spotify_auth_state"
    );


    /*
       Remove ?code=... from the URL.
    */

    window.history.replaceState(
        {},
        document.title,
        REDIRECT_URI
    );


    /*
       The popup has finished its job.
    */

    setStatus(
        "Spotify connected! You can close this window ♡"
    );


    /*
       Give postMessage a moment to reach the
       Notion iframe before closing.
    */

    setTimeout(
        () => {

            window.close();

        },
        700
    );

}


/* =========================================================
   7. TOKEN STORAGE
   ========================================================= */

function saveTokens(data) {

    /*
       Store access token.
    */

    localStorage.setItem(
        "spotify_access_token",
        data.access_token
    );


    /*
       Calculate when it expires.

       Spotify's access tokens normally expire
       after a limited period, so we keep track
       of the expiry time.
    */

    localStorage.setItem(
        "spotify_token_expiry",
        String(
            Date.now() +
            (data.expires_in * 1000)
        )
    );


    /*
       Save refresh token if Spotify supplied one.
    */

    if (data.refresh_token) {

        localStorage.setItem(
            "spotify_refresh_token",
            data.refresh_token
        );

    }

}


/* =========================================================
   7A. SEND TOKEN TO NOTION PLAYER
   ========================================================= */

function sendAuthenticationToOpener(
    tokenData
) {

    /*
       If the popup was not opened by anything,
       there is nowhere to send the token.
    */

    if (
        !window.opener
    ) {

        console.warn(
            "No opener window was found."
        );

        return;

    }


    /*
       Retrieve the origin of the window that
       originally opened this popup.

       Example:

       https://www.notion.so

       or

       https://app.notion.com
    */

    const openerOrigin =
        sessionStorage.getItem(
            "spotify_opener_origin"
        );


    /*
       We don't want to send an access token to
       an unknown website.

       If we can't identify the opener origin,
       stop instead of using "*".
    */

    if (
        !openerOrigin
    ) {

        console.error(
            "Cannot safely determine the opener origin."
        );

        return;

    }


    /*
       Send only the authentication information
       needed by our cassette player.
    */

    window.opener.postMessage(

        {

            type:
                "spotify-auth-success",

            access_token:
                tokenData.access_token,

            refresh_token:
                tokenData.refresh_token || null,

            expires_in:
                tokenData.expires_in

        },

        openerOrigin

    );

}


/* =========================================================
   7B. RECEIVE AUTHENTICATION FROM POPUP
   ========================================================= */

window.addEventListener(
    "message",
    async (event) => {

        /*
           The popup itself should not process its own
           authentication message.
        */

        if (
            IS_AUTH_POPUP
        ) {

            return;

        }


        /*
           Only accept messages from our own
           GitHub Pages origin.

           This is important because access tokens
           should not be accepted from arbitrary websites.
        */

        if (
            event.origin !==
            APP_ORIGIN
        ) {

            console.warn(
                "Ignored message from:",
                event.origin
            );

            return;

        }


        /*
           Make sure the message has the expected format.
        */

        if (
            !event.data ||
            event.data.type !==
                "spotify-auth-success"
        ) {

            return;

        }


        /*
           Make sure the message came from a window
           we actually know about.

           The popup's origin is our GitHub Pages origin.
        */

        if (
            !event.source
        ) {

            return;

        }


        /*
           Save the received Spotify tokens in the
           Notion-embedded cassette player's own storage.
        */

        localStorage.setItem(
            "spotify_access_token",
            event.data.access_token
        );


        localStorage.setItem(
            "spotify_token_expiry",
            String(
                Date.now() +
                (
                    event.data.expires_in *
                    1000
                )
            )
        );


        if (
            event.data.refresh_token
        ) {

            localStorage.setItem(
                "spotify_refresh_token",
                event.data.refresh_token
            );

        }


        /*
           Now change the cassette from the login
           screen to the actual player.
        */

        loginArea.classList.add(
            "hidden"
        );


        playerArea.classList.remove(
            "hidden"
        );


        setStatus(
            "Spotify connected! Loading cassette... ♡"
        );


        /*
           Initialize Spotify Web Playback SDK.
        */

        await initializePlayer();

    }
);


/* =========================================================
   8. REFRESH ACCESS TOKEN
   ========================================================= */

async function refreshAccessToken() {

    const refreshToken =
        localStorage.getItem(
            "spotify_refresh_token"
        );


    if (!refreshToken) {

        return false;

    }


    const response =
        await fetch(
            "https://accounts.spotify.com/api/token",
            {

                method:
                    "POST",

                headers: {

                    "Content-Type":
                        "application/x-www-form-urlencoded"

                },

                body:
                    new URLSearchParams({

                        grant_type:
                            "refresh_token",

                        refresh_token:
                            refreshToken,

                        client_id:
                            CLIENT_ID

                    })

            }
        );


    const data =
        await response.json();


    if (!response.ok) {

        console.error(
            "Could not refresh Spotify token:",
            data
        );


        localStorage.removeItem(
            "spotify_access_token"
        );


        localStorage.removeItem(
            "spotify_token_expiry"
        );


        return false;

    }


    /*
       Spotify may not send a new refresh token.

       Our saveTokens() function only replaces the
       refresh token if a new one was actually supplied.
    */

    saveTokens(
        data
    );


    return true;

}


/* =========================================================
   8A. GET VALID ACCESS TOKEN
   ========================================================= */

async function getAccessToken() {

    const token =
        localStorage.getItem(
            "spotify_access_token"
        );


    const expiry =
        Number(
            localStorage.getItem(
                "spotify_token_expiry"
            ) || 0
        );


    /*
       If we still have a valid token, use it.
    */

    if (
        token &&
        Date.now() <
            expiry - 60000
    ) {

        return token;

    }


    /*
       Otherwise attempt to refresh it.
    */

    const refreshed =
        await refreshAccessToken();


    if (!refreshed) {

        return null;

    }


    return localStorage.getItem(
        "spotify_access_token"
    );

}


/* =========================================================
   8B. SPOTIFY API REQUEST HELPER
   ========================================================= */

async function spotifyFetch(
    url,
    options = {}
) {

    let token =
        await getAccessToken();


    if (!token) {

        throw new Error(
            "You need to log in to Spotify."
        );

    }


    let response =
        await fetch(
            url,
            {

                ...options,

                headers: {

                    ...(options.headers || {}),

                    Authorization:
                        `Bearer ${token}`

                }

            }
        );


    /*
       If Spotify says the token is expired,
       refresh it and retry once.
    */

    if (
        response.status === 401
    ) {

        const refreshed =
            await refreshAccessToken();


        if (!refreshed) {

            throw new Error(
                "Spotify login expired. Please connect again."
            );

        }


        token =
            await getAccessToken();


        response =
            await fetch(
                url,
                {

                    ...options,

                    headers: {

                        ...(options.headers || {}),

                        Authorization:
                            `Bearer ${token}`

                    }

                }
            );

    }


    return response;

}


    /* =========================================================
       9. GET PLAYLIST ID FROM URL
       ========================================================= */

    function extractPlaylistId(input) {

        input =
            input.trim();


        /*
           Allows either:
           https://open.spotify.com/playlist/ID
           spotify:playlist:ID
        */

        const urlMatch =
            input.match(
                /open\.spotify\.com\/playlist\/([a-zA-Z0-9]+)/
            );


        if (urlMatch) {

            return urlMatch[1];

        }


        const uriMatch =
            input.match(
                /spotify:playlist:([a-zA-Z0-9]+)/
            );


        if (uriMatch) {

            return uriMatch[1];

        }


        /*
           Also allow just the playlist ID.
        */

        if (
            /^[a-zA-Z0-9]+$/.test(input)
        ) {

            return input;

        }


        return null;

    }


    /* =========================================================
       10. LOAD PLAYLIST
       ========================================================= */

    async function loadPlaylist() {

        const input =
            playlistInput.value;


        const id =
            extractPlaylistId(input);


        if (!id) {

            setStatus(
                "Please paste a valid Spotify playlist URL ♡"
            );

            return;

        }


        playlistId = id;

        playlistUri =
            `spotify:playlist:${id}`;


        setStatus(
            "Loading your mixtape... ♫"
        );


        try {

            tracks = [];

            let url =
                `https://api.spotify.com/v1/playlists/${id}/items?limit=50`;


            while (url) {

                const response =
                    await spotifyFetch(url);


                if (!response.ok) {

                    const error =
                        await response.json()
                        .catch(() => ({}));


                    if (response.status === 403) {

                        throw new Error(
                            "Spotify won't let this app read that playlist. In Spotify's current API, this playlist needs to be owned by you or be collaborative with you."
                        );

                    }


                    throw new Error(
                        error.error?.message ||
                        "Unable to load playlist."
                    );

                }


                const data =
                    await response.json();


                for (
                    const item of data.items || []
                ) {

                    const track =
                        item.item;


                    if (
                        track &&
                        track.type === "track" &&
                        track.uri &&
                        track.is_playable !== false
                    ) {

                        tracks.push(track);

                    }

                }


                url =
                    data.next;

            }


            if (tracks.length === 0) {

                throw new Error(
                    "No playable songs were found in this playlist."
                );

            }


            displayTracks();

            setStatus(
                `${tracks.length} songs loaded ♡`
            );


        } catch (error) {

            console.error(error);

            setStatus(
                error.message
            );

        }

    }


    loadButton.addEventListener(
        "click",
        loadPlaylist
    );


    /* =========================================================
       11. DISPLAY TRACK LIST
       ========================================================= */

    function displayTracks() {

        trackList.innerHTML = "";


        tracks.forEach(
            (track, index) => {

                const row =
                    document.createElement(
                        "div"
                    );


                row.className =
                    "track";


                row.dataset.index =
                    index;


                const number =
                    document.createElement(
                        "div"
                    );


                number.className =
                    "track-number";


                number.textContent =
                    String(index + 1);


                const details =
                    document.createElement(
                        "div"
                    );


                details.className =
                    "track-details";


                const name =
                    document.createElement(
                        "div"
                    );


                name.className =
                    "track-name";


                name.textContent =
                    track.name;


                const artistName =
                    document.createElement(
                        "div"
                    );


                artistName.className =
                    "track-artist";


                artistName.textContent =
                    track.artists
                        .map(
                            artist =>
                                artist.name
                        )
                        .join(", ");


                details.appendChild(
                    name
                );


                details.appendChild(
                    artistName
                );


                row.appendChild(
                    number
                );


                row.appendChild(
                    details
                );


                row.addEventListener(
                    "click",
                    () => {

                        playTrack(index);

                    }
                );


                trackList.appendChild(
                    row
                );

            }
        );

    }


    /* =========================================================
       12. SPOTIFY WEB PLAYBACK SDK
       ========================================================= */

    window.onSpotifyWebPlaybackSDKReady =
        function () {

            spotifySDKReady = true;

            initializePlayer();

        };


    async function initializePlayer() {

        if (!spotifySDKReady) {
            return;
        }


        if (player) {
            return;
        }


        const token =
            await getAccessToken();


        if (!token) {
            return;
        }


        player =
            new Spotify.Player({

                name:
                    "Essie's Cute Cassette",

                volume:
                    0.7,

                getOAuthToken:
                    async callback => {

                        const freshToken =
                            await getAccessToken();

                        callback(
                            freshToken
                        );

                    }

            });


        /* READY */

        player.addListener(
            "ready",
            async ({ device_id }) => {

                deviceId =
                    device_id;


                setStatus(
                    "Cassette player ready ♡"
                );


                /*
                   Transfer Spotify playback
                   to our browser player.
                */

                try {

                    await spotifyFetch(
                        "https://api.spotify.com/v1/me/player",
                        {

                            method: "PUT",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({

                                    device_ids:
                                        [deviceId],

                                    play:
                                        false

                                })

                        }
                    );

                } catch (error) {

                    console.error(
                        error
                    );

                }

            }
        );


        /* CURRENT SONG */

        player.addListener(
            "player_state_changed",
            state => {

                if (!state) {
                    return;
                }


                const current =
                    state.track_window
                        .current_track;


                if (!current) {
                    return;
                }


                songTitle.textContent =
                    current.name;


                artist.textContent =
                    current.artists
                        .map(
                            a => a.name
                        )
                        .join(", ");


                playButton.textContent =
                    state.paused
                        ? "▶"
                        : "❚❚";


                cassette.classList.toggle(
                    "playing",
                    !state.paused
                );


                /*
                   Find the corresponding
                   song in our playlist.
                */

                const index =
                    tracks.findIndex(
                        track =>
                            track.uri ===
                            current.uri
                    );


                if (index !== -1) {

                    currentTrackIndex =
                        index;

                    highlightTrack(
                        index
                    );

                }

            }
        );


        /* ERRORS */

        player.addListener(
            "initialization_error",
            ({ message }) => {

                console.error(
                    "Initialization error:",
                    message
                );

                setStatus(
                    "Spotify player could not initialize."
                );

            }
        );


        player.addListener(
            "authentication_error",
            ({ message }) => {

                console.error(
                    "Authentication error:",
                    message
                );

                setStatus(
                    "Spotify authentication failed."
                );

            }
        );


        player.addListener(
            "account_error",
            ({ message }) => {

                console.error(
                    "Account error:",
                    message
                );

                setStatus(
                    "Spotify Premium is required for web playback."
                );

            }
        );


        player.addListener(
            "playback_error",
            ({ message }) => {

                console.error(
                    "Playback error:",
                    message
                );

                setStatus(
                    message
                );

            }
        );


        await player.connect();

    }


    /* =========================================================
       13. PLAY SELECTED SONG
       ========================================================= */

    async function playTrack(index) {

        if (!deviceId) {

            setStatus(
                "The cassette player is still connecting..."
            );

            return;

        }


        if (
            !playlistUri ||
            tracks.length === 0
        ) {

            return;

        }


        currentTrackIndex =
            index;


        setStatus(
            "Playing ♫"
        );


        try {

            /*
               We start the actual Spotify playlist
               at the selected position.

               This gives Previous / Next a real
               playlist context.
            */

            const response =
                await spotifyFetch(
                    `https://api.spotify.com/v1/me/player/play?device_id=${encodeURIComponent(deviceId)}`,
                    {

                        method: "PUT",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify({

                                context_uri:
                                    playlistUri,

                                offset: {

                                    position:
                                        index

                                },

                                position_ms:
                                    0

                            })

                    }
                );


            if (!response.ok) {

                const error =
                    await response.json()
                    .catch(() => ({}));


                throw new Error(
                    error.error?.message ||
                    "Unable to play this song."
                );

            }


            highlightTrack(
                index
            );


        } catch (error) {

            console.error(error);

            setStatus(
                error.message
            );

        }

    }


    /* =========================================================
       14. PLAY / PAUSE
       ========================================================= */

    playButton.addEventListener(
        "click",
        async () => {

            if (!player) {

                setStatus(
                    "Spotify player isn't ready yet."
                );

                return;

            }


            try {

                await player.activateElement();

                await player.togglePlay();

            } catch (error) {

                console.error(
                    error
                );

            }

        }
    );


    /* =========================================================
       15. NEXT
       ========================================================= */

    nextButton.addEventListener(
        "click",
        async () => {

            if (!player) {
                return;
            }


            try {

                await player.nextTrack();

            } catch (error) {

                console.error(
                    error
                );

            }

        }
    );


    /* =========================================================
       16. PREVIOUS
       ========================================================= */

    previousButton.addEventListener(
        "click",
        async () => {

            if (!player) {
                return;
            }


            try {

                await player.previousTrack();

            } catch (error) {

                console.error(
                    error
                );

            }

        }
    );


    /* =========================================================
       17. SHUFFLE
       ========================================================= */

    shuffleButton.addEventListener(
        "click",
        async () => {

            if (!deviceId) {
                return;
            }


            shuffleEnabled =
                !shuffleEnabled;


            try {

                const response =
                    await spotifyFetch(
                        `https://api.spotify.com/v1/me/player/shuffle?state=${shuffleEnabled}&device_id=${encodeURIComponent(deviceId)}`,
                        {

                            method: "PUT"

                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        "Unable to change shuffle mode."
                    );

                }


                shuffleButton.classList.toggle(
                    "active",
                    shuffleEnabled
                );


                shuffleButton.textContent =
                    shuffleEnabled
                        ? "🔀 SHUFFLE ON"
                        : "🔀 SHUFFLE";

            } catch (error) {

                console.error(
                    error
                );

                shuffleEnabled =
                    !shuffleEnabled;

            }

        }
    );


    /* =========================================================
       18. HIGHLIGHT CURRENT SONG
       ========================================================= */

    function highlightTrack(index) {

        document
            .querySelectorAll(".track")
            .forEach(
                element => {

                    element.classList.toggle(
                        "active",
                        Number(
                            element.dataset.index
                        ) === index
                    );

                }
            );

    }


   /* =========================================================
   19. INITIAL PAGE STARTUP
   ========================================================= */

async function startup() {

    /*
       Make sure the Client ID was entered.
    */

    if (
        CLIENT_ID ===
        "PASTE_YOUR_CLIENT_ID_HERE"
    ) {

        setStatus(
            "Add your Spotify Client ID to the code first ♡"
        );

        return;

    }


    /*
       =====================================================
       POPUP MODE
       =====================================================

       If this page was opened with:

       ?spotify_popup=1

       then this is the authentication popup.

       It should NOT display the normal player.
       It should start Spotify authorization instead.
    */

    if (
        IS_AUTH_POPUP
    ) {

        /*
           Check whether Spotify has already redirected
           us back with an authorization code.
        */

        const params =
            new URLSearchParams(
                window.location.search
            );


        const code =
            params.get(
                "code"
            );


        const returnedState =
            params.get(
                "state"
            );


        const error =
            params.get(
                "error"
            );


        /*
           Spotify login was cancelled or failed.
        */

        if (
            error
        ) {

            setStatus(
                `Spotify login cancelled: ${error}`
            );

            return;

        }


        /*
           We don't have a code yet.

           Therefore this is the first time the
           authentication popup has loaded.

           Start PKCE authorization.
        */

        if (
            !code
        ) {

            await startPopupAuthorization();

            return;

        }


        /*
           Spotify returned with a code.

           Verify the state value before exchanging it.
        */

        const savedState =
            sessionStorage.getItem(
                "spotify_auth_state"
            );


        if (
            !savedState ||
            savedState !==
                returnedState
        ) {

            setStatus(
                "Spotify security check failed. Please try again."
            );

            return;

        }


        /*
           Exchange authorization code for tokens.
        */

        try {

            setStatus(
                "Finishing Spotify login..."
            );


            await exchangeCode(
                code
            );


        } catch (error) {

            console.error(
                error
            );


            setStatus(
                error.message
            );

        }


        return;

    }


    /*
       =====================================================
       NORMAL MODE
       =====================================================

       This is the normal cassette player.

       If the user already has a valid Spotify token,
       immediately show the player.
    */

    const token =
        await getAccessToken();


    if (
        token
    ) {

        loginArea.classList.add(
            "hidden"
        );


        playerArea.classList.remove(
            "hidden"
        );


        setStatus(
            "Connecting to Spotify... ♫"
        );


        await initializePlayer();

    }

}

startup();

</script>
